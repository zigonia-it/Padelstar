<!doctype html>
<html lang="nb">

<head>
  <script>(function(){try{var t=localStorage.getItem("padelstar-theme");var m=(t==="light"||t==="dark")?t:(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=m}catch(e){document.documentElement.dataset.theme="dark"}})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Padelstar TV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon-64.png" type="image/png">
  <link rel="stylesheet" href="styles/tokens.css?v=padelstar-tokens-5">
  <link rel="stylesheet" href="styles/tv.css?v=padelstar-tv-19">
  <link rel="stylesheet" href="styles/tv-redesign.css?v=padelstar-tv-redesign-4">
</head>

<body class="tv-page">
  <main class="tv-app" aria-live="polite">
    <header class="tv-header">
      <span class="tv-brand"><img class="logo-on-light" src="assets/brand/padelstar-logo-dark.webp" alt="Padelstar" width="928" height="180"><img class="logo-on-dark" src="assets/brand/padelstar-logo-light.webp" alt="Padelstar" width="928" height="180"></span>
      <span class="tv-header-lines" aria-hidden="true"></span>
      <div class="tv-title-wrap"><span id="tvRoundLabel" data-tv-i18n="tv.round" data-tv-values='{"round":1}'>RUNDE 1</span>
        <h1 id="tvTournamentTitle">PADELSTAR</h1>
      </div>
      <span class="tv-header-lines tv-header-lines-right" aria-hidden="true"></span>
      <div class="tv-header-end">
        <div class="tv-theme-toggle" id="tvThemeToggle" role="group" aria-label="Fargetema">
          <button type="button" data-theme-option="light" data-theme-follows="resolved" aria-pressed="false" data-tv-i18n="theme.light">Lys</button>
          <button type="button" data-theme-option="dark" data-theme-follows="resolved" aria-pressed="false" data-tv-i18n="theme.dark">Mørk</button>
        </div>
        <time id="tvClock" class="tv-clock" datetime="">00:00</time>
      </div>
    </header>

    <section class="tv-columns">
      <section class="tv-panel tv-live-panel" aria-labelledby="liveTitle">
        <h2 id="liveTitle"><span class="live-dot"></span><span data-tv-i18n="tv.live">LIVE</span> <em data-tv-i18n="tv.liveNow">– PÅGÅR NÅ</em></h2>
        <div id="tvLiveMatches" class="tv-card-list"></div>
      </section>
      <section class="tv-panel tv-next-panel" aria-labelledby="nextTitle">
        <h2 id="nextTitle"><img class="heading-icon" src="assets/icons/games-96.png" alt=""><span data-tv-i18n="tv.next">NESTE KAMP</span></h2>
        <div id="tvNextMatches" class="tv-card-list"></div>
      </section>
      <section class="tv-panel tv-standing-panel" id="tvStandingPanel" aria-labelledby="standingTitle">
        <h2 id="standingTitle"><img class="heading-icon" src="assets/icons/trophy-96.png" alt=""><span data-tv-i18n="tv.standings">STILLING</span></h2>
        <div class="tv-table-head" id="tvStandingsHead">
          <span>#</span><span data-tv-i18n="tv.colPlayer">SPILLER</span><span data-tv-i18n="tv.colMatches">KAMPER</span><span data-tv-i18n="tv.colWins">SEIER</span><span data-tv-i18n="tv.colPoints">POENG</span><span data-tv-i18n="tv.colDiff">DIFF</span>
        </div>
        <ol id="tvStandings" class="tv-standings"></ol>
        <div id="tvCupBracket" class="tv-cup-bracket hidden">
          <div class="tv-cup-champion hidden" id="tvCupChampion"></div>
          <div class="tv-bracket-tree-wrap">
            <svg class="tv-bracket-svg" id="tvBracketSvg"></svg>
            <div class="tv-bracket-tree" id="tvBracketTree"></div>
          </div>
          <div class="tv-bracket-extra" id="tvBracketExtra"></div>
        </div>
      </section>
    </section>

    <footer class="tv-footer">
      <div><span class="footer-icon">◎</span><strong id="tvProgress" data-tv-i18n="tv.roundOf" data-tv-values='{"round":1,"total":1}'>RUNDE 1 / 1</strong></div>
      <div><span class="footer-icon">♟</span><strong id="tvPlayerProgress">0 / 0</strong><span data-tv-i18n="tv.matchesDone">KAMPER FERDIG</span>
      </div>
      <p id="tvMessage" data-tv-i18n="tv.message0">GODE KAMPER. GODE ØYEBLIKK.</p>
      <div class="tv-footer-status"><span class="live-dot"></span><strong id="tvStatus" data-tv-i18n="tv.statusLive">LIVE</strong></div>
      <button id="tvExitButton" type="button" data-tv-i18n="tv.exit">TILBAKE</button>
    </footer>
  </main>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app/accent-system.js?v=padelstar-accent-system-2"></script>
  <script src="app/player-visuals.js?v=padelstar-player-visuals-3"></script>
  <script src="app/translations.js?v=padelstar-i18n-71"></script>
  <script src="app/scoring-engine.js?v=padelstar-scoring-7"></script>
  <script src="app/color-mode.js?v=padelstar-color-mode-3"></script>
  <script src="app/tv-mode.js?v=padelstar-tv-mode-13"></script>
</body>

</html>
